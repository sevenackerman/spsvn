name: Upload MP4 to Google Drive

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL file MP4 cần tải'
        required: true

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download video
        run: |
          curl -L "${{ github.event.inputs.video_url }}" -o video.mp4

      - name: Upload to Google Drive
        uses: logickoder/google-drive-upload@1.0.1
        with:
          authType: oauth
          clientId: ${{ secrets.GOOGLE_CLIENT_ID }}
          clientSecret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          refreshToken: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          filename: video.mp4
          folderId: <ID_thư_mục_trên_Drive>
          name: video_uploaded.mp4
          overwrite: true
          mimeType: video/mp4
