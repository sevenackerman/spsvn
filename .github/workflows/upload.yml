name: Upload MP4 to Google Drive

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL file MP4 cần tải'
        required: true

jobs:
  upload-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download video
        run: |
          curl -L "${{ github.event.inputs.video_url }}" -o video.mp4
          RAND=$(date +%s)
          mv video.mp4 video_${RAND}.mp4
          echo "RAND=$RAND" >> $GITHUB_ENV

      - name: Upload to Google Drive with OAuth
        id: upload
        uses: logickoder/g-drive-upload@main
        with:
          authType: 'oauth'
          clientId: ${{ secrets.GOOGLE_CLIENT_ID }}
          clientSecret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          refreshToken: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          filename: "video_${{ env.RAND }}.mp4"
          folderId: ${{ secrets.FOLDER_ID }}
          name: "video_uploaded_${{ env.RAND }}.mp4"
          overwrite: 'true'
          mimeType: 'video/mp4'

      - name: Make file public
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GOOGLE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://www.googleapis.com/drive/v3/files/${{ steps.upload.outputs.fileId }}/permissions" \
            -d '{
              "role": "reader",
              "type": "anyone"
            }'

      - name: Construct Drive link
        run: echo "DRIVE_LINK=https://drive.google.com/file/d/${{ steps.upload.outputs.fileId }}/view?usp=sharing" >> $GITHUB_ENV

      - name: Send link to Lark Base
        run: |
          curl -X POST "https://trans-cosmos.larksuite.com/base/workflow/webhook/event/R5afajhrMw02mGhgtFzuTp3Zs0t" \
          -H "Content-Type: application/json" \
          -d "{
            \"drive_link\": \"${DRIVE_LINK}\",
            \"source_url\": \"${{ github.event.inputs.video_url }}\"
          }"
