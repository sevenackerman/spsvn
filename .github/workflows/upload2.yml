name: Upload MP4 to Lark Base 2

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL file MP4 cần tải'
        required: true

jobs:
  upload-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download video
        run: |
          curl -L "${{ github.event.inputs.video_url }}" -o video.mp4
          RAND=$(date +%s)
          mv video.mp4 video_${RAND}.mp4
          echo "RAND=$RAND" >> $GITHUB_ENV

      - name: Prepare upload on Lark Base
        id: lark_prepare
        run: |
          set -euo pipefail
          FILE="video_${RAND}.mp4"
          SIZE=$(stat -c%s "$FILE")
          ORIGIN="https://trans-cosmos.larksuite.com"
          COOKIE="passport_web_did=7670174375420628706; passport_trace_id=7670174375437405917; QXV0aHpDb250ZXh0=562ff534f2b64d41a4507d1b74c166df; first_landing_url=https://accounts.larksuite.com/accounts/page/login?app_id=1&no_trap=1&redirect_uri=https%253A%252F%252Fwww.larksuite.com%252Fmessenger; landing_url=https://accounts.larksuite.com/accounts/page/login?app_id=1&no_trap=1&redirect_uri=https%253A%252F%252Fwww.larksuite.com%252Fmessenger; _gcl_au=1.1.887165197.1785851638; s_v_web_id=verify_msepyf6m_MqaiQnVR_NMLX_44rh_9XgK_GtivRInAnfXS; _fuid=NzBiMTdkM2ItZWRlOS00MTNiLWIzNjktMGJkMTFhNDQ5OWRl; session=XN0YXJ0-516tf649-1d4d-41ab-991f-999hbrleaq0k-WVuZA; session_list=XN0YXJ0-516tf649-1d4d-41ab-991f-999hbrleaq0k-WVuZA; login_recently=1; i18n_locale=vi-VN; is_anonymous_session=; lang=vi; i18n_locale=vi; js_version=1; et=ed08d86f867e54cd0acdf3d1ab6ba80c; _csrf_token=d03e92533775588c3d17ac1f7e91a6e40ce86c55-1785851902; ccm_cdn_host=//lf-package-sg.larksuitecdn.com/obj/lark-static-sg; __tea__ug__uid=5781140141414111241; locale=vi-VN; _tea_utm_cache_302704=undefined; sl_session=eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9..QPwCbZVb3Vi_gC0TP-PNawmXssQLBDwCNG2h6Hp4G-L7LiI3cuvj5i7ikk4IaqnRn03jvtYIXrMiapoI1HFYOw"
          CSRF="d03e92533775588c3d17ac1f7e91a6e40ce86c55-1785851902"
          MOUNT_POINT="bitable_file"
          MOUNT_NODE_TOKEN="LnrIbvRYXa7QG7sIPhOuKp8qsIf"

          echo "Preparing upload for $FILE size=$SIZE"

          PREPARE_RESP=$(curl -s -X POST "${ORIGIN}/space/api/box/upload/prepare/" \
            -H "Content-Type: application/json" \
            -H "Cookie: ${COOKIE}" \
            -H "x-csrftoken: ${CSRF}" \
            -d "{\"mount_point\":\"${MOUNT_POINT}\",\"mount_node_token\":\"${MOUNT_NODE_TOKEN}\",\"name\":\"${FILE}\",\"size\":${SIZE},\"size_checker\":false}")

          echo "$PREPARE_RESP" > prepare.json
          cat prepare.json

          UPLOAD_ID=$(echo "$PREPARE_RESP" | jq -r '.data.upload_id')
          BLOCK_SIZE=$(echo "$PREPARE_RESP" | jq -r '.data.block_size')
          NUM_BLOCKS=$(echo "$PREPARE_RESP" | jq -r '.data.num_blocks')

          echo "UPLOAD_ID=$UPLOAD_ID" >> $GITHUB_ENV
          echo "BLOCK_SIZE=$BLOCK_SIZE" >> $GITHUB_ENV
          echo "NUM_BLOCKS=$NUM_BLOCKS" >> $GITHUB_ENV

      - name: Upload file blocks to Lark Base
        id: lark_upload_blocks
        run: |
          set -euo pipefail
          FILE="video_${RAND}.mp4"
          UPLOAD_ID="${{ env.UPLOAD_ID }}"
          BLOCK_SIZE="${{ env.BLOCK_SIZE }}"
          ORIGIN="https://trans-cosmos.larksuite.com"
          COOKIE="passport_web_did=7670174375420628706; passport_trace_id=7670174375437405917; QXV0aHpDb250ZXh0=562ff534f2b64d41a4507d1b74c166df; first_landing_url=https://accounts.larksuite.com/accounts/page/login?app_id=1&no_trap=1&redirect_uri=https%253A%252F%252Fwww.larksuite.com%252Fmessenger; landing_url=https://accounts.larksuite.com/accounts/page/login?app_id=1&no_trap=1&redirect_uri=https%253A%252F%252Fwww.larksuite.com%252Fmessenger; _gcl_au=1.1.887165197.1785851638; s_v_web_id=verify_msepyf6m_MqaiQnVR_NMLX_44rh_9XgK_GtivRInAnfXS; _fuid=NzBiMTdkM2ItZWRlOS00MTNiLWIzNjktMGJkMTFhNDQ5OWRl; session=XN0YXJ0-516tf649-1d4d-41ab-991f-999hbrleaq0k-WVuZA; session_list=XN0YXJ0-516tf649-1d4d-41ab-991f-999hbrleaq0k-WVuZA; login_recently=1; i18n_locale=vi-VN; is_anonymous_session=; lang=vi; i18n_locale=vi; js_version=1; et=ed08d86f867e54cd0acdf3d1ab6ba80c; _csrf_token=d03e92533775588c3d17ac1f7e91a6e40ce86c55-1785851902; ccm_cdn_host=//lf-package-sg.larksuitecdn.com/obj/lark-static-sg; __tea__ug__uid=5781140141414111241; locale=vi-VN; _tea_utm_cache_302704=undefined; sl_session=eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9..QPwCbZVb3Vi_gC0TP-PNawmXssQLBDwCNG2h6Hp4G-L7LiI3cuvj5i7ikk4IaqnRn03jvtYIXrMiapoI1HFYOw"
          CSRF="d03e92533775588c3d17ac1f7e91a6e40ce86c55-1785851902"

          FILE_SIZE=$(stat -c%s "$FILE")
          if [ -z "${{ env.NUM_BLOCKS }}" ] || [ "${{ env.NUM_BLOCKS }}" = "null" ]; then
            NUM_BLOCKS=$(( (FILE_SIZE + BLOCK_SIZE - 1) / BLOCK_SIZE ))
          else
            NUM_BLOCKS=${{ env.NUM_BLOCKS }}
          fi

          for INDEX in $(seq 0 $((NUM_BLOCKS - 1))); do
            OFFSET=$(( INDEX * BLOCK_SIZE ))
            CHUNK_FILE="/tmp/chunk_${INDEX}.bin"
            dd if="$FILE" of="$CHUNK_FILE" bs=1 skip=$OFFSET count=$BLOCK_SIZE status=none || true

            echo "Uploading block ${INDEX} (offset=${OFFSET})"
            curl -s -X POST "${ORIGIN}/space/api/box/upload/block/" \
              -H "Cookie: ${COOKIE}" \
              -H "x-csrftoken: ${CSRF}" \
              -F "upload_id=${UPLOAD_ID}" \
              -F "block_index=${INDEX}" \
              -F "file=@${CHUNK_FILE};type=application/octet-stream" \
              -o /tmp/block_resp_${INDEX}.json

            cat /tmp/block_resp_${INDEX}.json
            rm -f "$CHUNK_FILE"
          done

      - name: Finish upload on Lark Base
        id: lark_finish
        run: |
          set -euo pipefail
          FILE="video_${RAND}.mp4"
          SIZE=$(stat -c%s "$FILE")
          ORIGIN="https://trans-cosmos.larksuite.com"
          COOKIE="passport_web_did=7670174375420628706; passport_trace_id=7670174375437405917; QXV0aHpDb250ZXh0=562ff534f2b64d41a4507d1b74c166df; first_landing_url=https://accounts.larksuite.com/accounts/page/login?app_id=1&no_trap=1&redirect_uri=https%253A%252F%252Fwww.larksuite.com%252Fmessenger; landing_url=https://accounts.larksuite.com/accounts/page/login?app_id=1&no_trap=1&redirect_uri=https%253A%252F%252Fwww.larksuite.com%252Fmessenger; _gcl_au=1.1.887165197.1785851638; s_v_web_id=verify_msepyf6m_MqaiQnVR_NMLX_44rh_9XgK_GtivRInAnfXS; _fuid=NzBiMTdkM2ItZWRlOS00MTNiLWIzNjktMGJkMTFhNDQ5OWRl; session=XN0YXJ0-516tf649-1d4d-41ab-991f-999hbrleaq0k-WVuZA; session_list=XN0YXJ0-516tf649-1d4d-41ab-991f-999hbrleaq0k-WVuZA; login_recently=1; i18n_locale=vi-VN; is_anonymous_session=; lang=vi; i18n_locale=vi; js_version=1; et=ed08d86f867e54cd0acdf3d1ab6ba80c; _csrf_token=d03e92533775588c3d17ac1f7e91a6e40ce86c55-1785851902; ccm_cdn_host=//lf-package-sg.larksuitecdn.com/obj/lark-static-sg; __tea__ug__uid=5781140141414111241; locale=vi-VN; _tea_utm_cache_302704=undefined; sl_session=eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9..QPwCbZVb3Vi_gC0TP-PNawmXssQLBDwCNG2h6Hp4G-L7LiI3cuvj5i7ikk4IaqnRn03jvtYIXrMiapoI1HFYOw"
          CSRF="d03e92533775588c3d17ac1f7e91a6e40ce86c55-1785851902"
          MOUNT_POINT="bitable_file"
          MOUNT_NODE_TOKEN="LnrIbvRYXa7QG7sIPhOuKp8qsIf"
          UPLOAD_ID="${{ env.UPLOAD_ID }}"

          echo "Finishing upload upload_id=$UPLOAD_ID"

          FINISH_RESP=$(curl -s -X POST "${ORIGIN}/space/api/box/upload/finish/" \
            -H "Content-Type: application/json" \
            -H "Cookie: ${COOKIE}" \
            -H "x-csrftoken: ${CSRF}" \
            -d "{\"upload_id\":\"${UPLOAD_ID}\",\"num_blocks\":${{ env.NUM_BLOCKS }},\"mount_point\":\"${MOUNT_POINT}\",\"push_open_history_record\":0}")

          echo "$FINISH_RESP" > finish.json
          cat finish.json

          FILE_TOKEN=$(echo "$FINISH_RESP" | jq -r '.data.file_token // empty')
          VERSION=$(echo "$FINISH_RESP" | jq -r '.data.version // empty')
          if [ -n "$FILE_TOKEN" ]; then
            echo "FILE_TOKEN=$FILE_TOKEN" >> $GITHUB_ENV
          fi
          if [ -n "$VERSION" ]; then
            echo "VERSION=$VERSION" >> $GITHUB_ENV
          fi

      - name: Submit file to Bitable form view
        id: lark_submit_form
        run: |
          set -euo pipefail
          FILE="video_${RAND}.mp4"
          ORIGIN="https://trans-cosmos.larksuite.com"
          COOKIE="passport_web_did=7670174375420628706; passport_trace_id=7670174375437405917; QXV0aHpDb250ZXh0=562ff534f2b64d41a4507d1b74c166df; first_landing_url=https://accounts.larksuite.com/accounts/page/login?app_id=1&no_trap=1&redirect_uri=https%253A%252F%252Fwww.larksuite.com%252Fmessenger; landing_url=https://accounts.larksuite.com/accounts/page/login?app_id=1&no_trap=1&redirect_uri=https%253A%252F%252Fwww.larksuite.com%252Fmessenger; _gcl_au=1.1.887165197.1785851638; s_v_web_id=verify_msepyf6m_MqaiQnVR_NMLX_44rh_9XgK_GtivRInAnfXS; _fuid=NzBiMTdkM2ItZWRlOS00MTNiLWIzNjktMGJkMTFhNDQ5OWRl; session=XN0YXJ0-516tf649-1d4d-41ab-991f-999hbrleaq0k-WVuZA; session_list=XN0YXJ0-516tf649-1d4d-41ab-991f-999hbrleaq0k-WVuZA; login_recently=1; i18n_locale=vi-VN; is_anonymous_session=; lang=vi; i18n_locale=vi; js_version=1; et=ed08d86f867e54cd0acdf3d1ab6ba80c; _csrf_token=d03e92533775588c3d17ac1f7e91a6e40ce86c55-1785851902; ccm_cdn_host=//lf-package-sg.larksuitecdn.com/obj/lark-static-sg; __tea__ug__uid=5781140141414111241; locale=vi-VN; _tea_utm_cache_302704=undefined; sl_session=eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9..QPwCbZVb3Vi_gC0TP-PNawmXssQLBDwCNG2h6Hp4G-L7LiI3cuvj5i7ikk4IaqnRn03jvtYIXrMiapoI1HFYOw"
          CSRF="d03e92533775588c3d17ac1f7e91a6e40ce86c55-1785851902"
          SHARE_TOKEN="shrusiHc9mLRfNF94HZq1va5Apc"
          MOUNT_NODE_TOKEN="LnrIbvRYXa7QG7sIPhOuKp8qsIf"
          TABLE_ID="tblE790P2zlker20"
          FIELD_ID="fldmG28Lps"
          WEBHOOK="https://trans-cosmos.larksuite.com/base/workflow/webhook/event/R5afajhrMw02mGhgtFzuTp3Zs0t"

          FILE_TOKEN="${{ env.FILE_TOKEN }}"
          if [ -z "$FILE_TOKEN" ]; then
            echo "ERROR: FILE_TOKEN is empty. Finish step may have failed."
            exit 1
          fi

          ATTACHMENT_JSON=$(jq -n \
            --arg id "$FILE_TOKEN" \
            --arg name "$FILE" \
            --arg mime "video/mp4" \
            --arg size "$(stat -c%s "$FILE")" \
            --arg ts "$(date +%s%3N)" \
            '{id:$id, attachmentToken:$id, name:$name, mimeType:$mime, size:($size|tonumber), timeStamp:($ts|tonumber)}')

          DATA_JSON=$(jq -n --arg fid "$FIELD_ID" --argjson attach "[$ATTACHMENT_JSON]" \
            '{($fid): {type:17, value:$attach}}')

          PAYLOAD=$(jq -n \
            --arg shareToken "$SHARE_TOKEN" \
            --arg token "$MOUNT_NODE_TOKEN" \
            --arg tableId "$TABLE_ID" \
            --argjson data "$DATA_JSON" \
            --arg fromSource "3" \
            '{shareToken:$shareToken, token:$token, tableId:$tableId, data:($data|tostring), fromSource:($fromSource|tonumber)}')

          curl -sS -X POST "${ORIGIN}/space/api/bitable/form/view" \
            -H "Content-Type: application/json" \
            -H "Cookie: ${COOKIE}" \
            -H "x-csrftoken: ${CSRF}" \
            -H "context: request_id=$(uuidgen);os=linux;app_version=ci;os_version=runner;platform=ci" \
            -d "$PAYLOAD" -o /tmp/bitable_resp.json || (cat /tmp/bitable_resp.json && exit 1)

          echo "Response from form/view:"
          jq . /tmp/bitable_resp.json || cat /tmp/bitable_resp.json

          NOTIFY_PAYLOAD=$(jq -n --arg name "$FILE" --arg src "${{ github.event.inputs.video_url }}" --arg token "$FILE_TOKEN" '{file_name:$name, source_url:$src, file_token:$token}')
          curl -s -X POST "$WEBHOOK" -H "Content-Type: application/json" -d "$NOTIFY_PAYLOAD" -o /tmp/notify_resp.json || true
          cat /tmp/notify_resp.json || true
