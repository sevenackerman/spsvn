name: Upload MP4 to Lark Base

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL file MP4 cần tải'
        required: true

jobs:
  upload-job:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ORIGIN: "https://trans-cosmos.larksuite.com"
      # COOKIE dùng block scalar để tránh lỗi YAML parsing
      COOKIE: |
        passport_web_did=7670174375420628706; passport_trace_id=7670174375437405917; QXV0aHpDb250ZXh0=562ff534f2b64d41a4507d1b74c166df; first_landing_url=https://accounts.larksuite.com/accounts/page/login?app_id=1&no_trap=1&redirect_uri=https%253A%252F%252Fwww.larksuite.com%252Fmessenger; landing_url=https://accounts.larksuite.com/accounts/page/login?app_id=1&no_trap=1&redirect_uri=https%253A%252F%252Fwww.larksuite.com%252Fmessenger; _gcl_au=1.1.887165197.1785851638; s_v_web_id=verify_msepyf6m_MqaiQnVR_NMLX_44rh_9XgK_GtivRInAnfXS; _fuid=NzBiMTdkM2ItZWRlOS00MTNiLWIzNjktMGJkMTFhNDQ5OWRl; session=XN0YXJ0-516tf649-1d4d-41ab-991f-999hbrleaq0k-WVuZA; session_list=XN0YXJ0-516tf649-1d4d-41ab-991f-999hbrleaq0k-WVuZA; login_recently=1; i18n_locale=vi-VN; is_anonymous_session=; lang=vi; i18n_locale=vi; js_version=1; et=ed08d86f867e54cd0acdf3d1ab6ba80c; _csrf_token=d03e92533775588c3d17ac1f7e91a6e40ce86c55-1785851902; ccm_cdn_host=//lf-package-sg.larksuitecdn.com/obj/lark-static-sg; __tea__ug__uid=5781140141414111241; locale=vi-VN; _tea_utm_cache_302704=undefined; sl_session=eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9..QPwCbZVb3Vi_gC0TP-PNawmXssQLBDwCNG2h6Hp4G-L7LiI3cuvj5i7ikk4IaqnRn03jvtYIXrMiapoI1HFYOw
      CSRF: "d03e92533775588c3d17ac1f7e91a6e40ce86c55-1785851902"
      MOUNT_POINT: "bitable_file"
      MOUNT_NODE_TOKEN: "LnrIbvRYXa7QG7sIPhOuKp8qsIf"
      SHARE_TOKEN: "shrusiHc9mLRfNF94HZq1va5Apc"
      TABLE_ID: "tblE790P2zlker20"
      FIELD_ID: "fldmG28Lps"
      WEBHOOK: "https://trans-cosmos.larksuite.com/base/workflow/webhook/event/R5afajhrMw02mGhgtFzuTp3Zs0t"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq coreutils

      - name: Download video
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 "${{ github.event.inputs.video_url }}" -o video.mp4
          RAND=$(date +%s)
          mv video.mp4 video_${RAND}.mp4
          echo "RAND=$RAND" >> $GITHUB_ENV
          ls -lh video_${RAND}.mp4

      - name: Prepare upload on Lark Base
        id: lark_prepare
        run: |
          set -euo pipefail
          FILE="video_${RAND}.mp4"
          [ -f "$FILE" ] || (echo "File not found: $FILE" && exit 1)
          SIZE=$(stat -c%s "$FILE")

          PREPARE_RESP=$(curl -sS -w "\n%{http_code}" -X POST "${ORIGIN}/space/api/box/upload/prepare/" \
            -H "Content-Type: application/json" \
            -H "Cookie: ${COOKIE}" \
            -H "x-csrftoken: ${CSRF}" \
            -d "{\"mount_point\":\"${MOUNT_POINT}\",\"mount_node_token\":\"${MOUNT_NODE_TOKEN}\",\"name\":\"${FILE}\",\"size\":${SIZE},\"size_checker\":false}")

          HTTP=$(echo "$PREPARE_RESP" | tail -n1)
          BODY=$(echo "$PREPARE_RESP" | sed '$d')
          echo "prepare http_code=$HTTP"
          echo "$BODY" > prepare.json
          cat prepare.json

          if [ "$HTTP" -ge 400 ]; then
            echo "Prepare failed" && exit 1
          fi

          UPLOAD_ID=$(echo "$BODY" | jq -r '.data.upload_id')
          BLOCK_SIZE=$(echo "$BODY" | jq -r '.data.block_size')
          NUM_BLOCKS=$(echo "$BODY" | jq -r '.data.num_blocks')

          echo "UPLOAD_ID=$UPLOAD_ID" >> $GITHUB_ENV
          echo "BLOCK_SIZE=$BLOCK_SIZE" >> $GITHUB_ENV
          echo "NUM_BLOCKS=$NUM_BLOCKS" >> $GITHUB_ENV

      - name: Upload file blocks to Lark Base
        id: lark_upload_blocks
        run: |
          set -euo pipefail
          FILE="video_${RAND}.mp4"
          UPLOAD_ID="${{ env.UPLOAD_ID }}"
          BLOCK_SIZE="${{ env.BLOCK_SIZE }}"
          FILE_SIZE=$(stat -c%s "$FILE")

          if [ -z "${{ env.NUM_BLOCKS }}" ] || [ "${{ env.NUM_BLOCKS }}" = "null" ]; then
            NUM_BLOCKS=$(( (FILE_SIZE + BLOCK_SIZE - 1) / BLOCK_SIZE ))
          else
            NUM_BLOCKS=${{ env.NUM_BLOCKS }}
          fi

          for INDEX in $(seq 0 $((NUM_BLOCKS - 1))); do
            OFFSET=$(( INDEX * BLOCK_SIZE ))
            CHUNK_FILE="/tmp/chunk_${INDEX}.bin"
            dd if="$FILE" of="$CHUNK_FILE" bs="$BLOCK_SIZE" skip="$OFFSET" count=1 iflag=skip_bytes,count_bytes status=none || true

            echo "Uploading block ${INDEX} (offset=${OFFSET})"
            RESP=$(curl -sS -w "\n%{http_code}" -X POST "${ORIGIN}/space/api/box/upload/block/" \
              -H "Cookie: ${COOKIE}" \
              -H "x-csrftoken: ${CSRF}" \
              -F "upload_id=${UPLOAD_ID}" \
              -F "block_index=${INDEX}" \
              -F "file=@${CHUNK_FILE};type=application/octet-stream")
            HTTP=$(echo "$RESP" | tail -n1)
            BODY=$(echo "$RESP" | sed '$d')
            echo "block ${INDEX} http=$HTTP"
            echo "$BODY" > /tmp/block_resp_${INDEX}.json
            if [ "$HTTP" -ge 400 ]; then
              cat /tmp/block_resp_${INDEX}.json
              exit 1
            fi
            rm -f "$CHUNK_FILE"
          done

      - name: Finish upload on Lark Base
        id: lark_finish
        run: |
          set -euo pipefail
          FILE="video_${RAND}.mp4"
          UPLOAD_ID="${{ env.UPLOAD_ID }}"

          FINISH_RESP=$(curl -sS -w "\n%{http_code}" -X POST "${ORIGIN}/space/api/box/upload/finish/" \
            -H "Content-Type: application/json" \
            -H "Cookie: ${COOKIE}" \
            -H "x-csrftoken: ${CSRF}" \
            -d "{\"upload_id\":\"${UPLOAD_ID}\",\"num_blocks\":${{ env.NUM_BLOCKS }},\"mount_point\":\"${MOUNT_POINT}\",\"push_open_history_record\":0}")

          HTTP=$(echo "$FINISH_RESP" | tail -n1)
          BODY=$(echo "$FINISH_RESP" | sed '$d')
          echo "finish http_code=$HTTP"
          echo "$BODY" > finish.json
          cat finish.json
          if [ "$HTTP" -ge 400 ]; then
            exit 1
          fi

          FILE_TOKEN=$(echo "$BODY" | jq -r '.data.file_token // empty')
          echo "FILE_TOKEN=$FILE_TOKEN" >> $GITHUB_ENV

      - name: Submit file to Bitable form view
        id: lark_submit_form
        run: |
          set -euo pipefail
          FILE="video_${RAND}.mp4"
          FILE_TOKEN="${{ env.FILE_TOKEN }}"
          if [ -z "$FILE_TOKEN" ]; then
            echo "ERROR: FILE_TOKEN is empty. Finish step may have failed."
            exit 1
          fi

          ATTACHMENT_JSON=$(jq -n \
            --arg id "$FILE_TOKEN" \
            --arg name "$FILE" \
            --arg mime "video/mp4" \
            --arg size "$(stat -c%s "$FILE")" \
            --arg ts "$(date +%s%3N)" \
            '{id:$id, attachmentToken:$id, name:$name, mimeType:$mime, size:($size|tonumber), timeStamp:($ts|tonumber)}')

          DATA_JSON=$(jq -n --arg fid "${FIELD_ID}" --argjson attach "[$ATTACHMENT_JSON]" \
            '{($fid): {type:17, value:$attach}}')

          PAYLOAD=$(jq -n \
            --arg shareToken "${SHARE_TOKEN}" \
            --arg token "${MOUNT_NODE_TOKEN}" \
            --arg tableId "${TABLE_ID}" \
            --argjson data "$DATA_JSON" \
            --arg fromSource "3" \
            '{shareToken:$shareToken, token:$token, tableId:$tableId, data:($data|tostring), fromSource:($fromSource|tonumber)}')

          RESP=$(curl -sS -w "\n%{http_code}" -X POST "${ORIGIN}/space/api/bitable/form/view" \
            -H "Content-Type: application/json" \
            -H "Cookie: ${COOKIE}" \
            -H "x-csrftoken: ${CSRF}" \
            -d "$PAYLOAD")
          HTTP=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')
          echo "form/view http_code=$HTTP"
          echo "$BODY" > /tmp/bitable_resp.json
          cat /tmp/bitable_resp.json
          if [ "$HTTP" -ge 400 ]; then
            exit 1
          fi

      - name: Optional notify webhook
        if: always()
        run: |
          set -euo pipefail
          FILE="video_${RAND}.mp4"
          FILE_TOKEN="${{ env.FILE_TOKEN }}"
          NOTIFY_PAYLOAD=$(jq -n --arg name "$FILE" --arg src "${{ github.event.inputs.video_url }}" --arg token "$FILE_TOKEN" '{file_name:$name, source_url:$src, file_token:$token}')
          curl -s -X POST "${WEBHOOK}" -H "Content-Type: application/json" -d "$NOTIFY_PAYLOAD" -o /tmp/notify_resp.json || true
          cat /tmp/notify_resp.json || true
